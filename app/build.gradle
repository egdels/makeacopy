    namespace = 'de.schliweb.makeacopy'
    compileSdk = 36

    ndkVersion = '28.0.13004108'

    defaultConfig {
        applicationId "de.schliweb.makeacopy"
        minSdk = 29
        targetSdk = 36
        versionCode 40801
        versionName "4.8.1"

        // Use default AndroidX test runner
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Feature flags
        buildConfigField "boolean", "FEATURE_SCAN_LIBRARY", "true"
        buildConfigField "boolean", "FEATURE_REVIEW_OCR", "true"
        buildConfigField "boolean", "FEATURE_FRAMING_LOGGING", "false"
        buildConfigField "boolean", "FEATURE_A11Y_GUIDANCE", "true"
        buildConfigField "boolean", "FEATURE_INBOX_MODE", "true"
        buildConfigField "boolean", "FEATURE_CROP_EDGE_DRAG", "true"
        buildConfigField "boolean", "FEATURE_CROP_PAN_ZOOM", "true"
        buildConfigField "boolean", "FEATURE_CORNER_REFINEMENT", "true"
        buildConfigField "boolean", "FEATURE_DOCQUAD_ROTATION_TTA", "true"
        buildConfigField "boolean", "FEATURE_FOCUS_QUALITY_INDICATOR", "true"

        if (isLight) {
            applicationIdSuffix ".light"
            versionNameSuffix "-light"
        }
    }

    dependenciesInfo {
        // Disables the inclusion of dependency metadata in the APK,
        // required for F-Droid to comply with its focus on privacy and transparency.
        // Dependency metadata is unnecessary and could expose additional information.
        includeInApk = false
        // Disables the inclusion of dependency metadata in Android App Bundles as well.
        includeInBundle = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        dex {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file('keystore.jks')
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only use signing config when available (GitHub Actions)
            // F-Droid will sign with their own keys
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    splits {
        abi {
            enable = enableAbiSplits
            reset()
            def abisEnv = System.getenv("ABIS")
            def abisProp = (project.findProperty("ABIS") ?: project.findProperty("abis"))
            def abisList = ((abisEnv ?: abisProp) ?: "arm64-v8a armeabi-v7a x86_64 x86")
                    .trim()
                    .split(/[,\s]+/) as List<String>
            println "Gradle ABI splits: ${abisList}"
            abisList.each { include it }

            universalApk = false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    // Test assets (PDFs, JPEGs, ground-truth TXTs) live under
    // app/src/androidTest/assets/instrumented_test_data/ and are merged into the
    // debug APK only via the debug sourceSet below. They are never part of the
    // release APK (verified by `verifyNoTestDataInApk`).

    sourceSets {
        main {
            assets.srcDirs = [
                    'src/main/assets',
                    layout.buildDirectory.dir("generated/assets/licenses").get().asFile,
                    layout.buildDirectory.dir("generated/assets/docs").get().asFile
            ]
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
        // Add test assets to the debug APK so target-context based asset loading works
        // (e.g. ApplicationProvider.getApplicationContext().getAssets()). The release build
        // is verified separately to ensure no test data leaks into production.
        debug {
            assets.srcDirs += ['src/androidTest/assets']
        }
    }
}

// Optional real-world corner eval set for CornerPipelineEvalTest (layout: images/ + labels/,
// see training/EVALUATION.md). It is bundled into the androidTest APK only when
// -PcornerEvalDir=<dir> is passed, so regular test builds are not bloated by the photos.
// -PcornerEvalModel=<file.ort> additionally bundles a candidate model that is evaluated instead of
// the shipped one (give candidates distinct file names; they are cached on the device by name).
def cornerEvalDir = providers.gradleProperty('cornerEvalDir').orNull
def cornerEvalModel = providers.gradleProperty('cornerEvalModel').orNull
if (cornerEvalDir != null) {
    def cornerEvalSource = rootProject.file(cornerEvalDir)
    if (!new File(cornerEvalSource, 'labels').isDirectory()) {
        throw new GradleException("cornerEvalDir has no labels/ directory: ${cornerEvalSource}")
    }
    def cornerEvalAssets = layout.buildDirectory.dir("generated/assets/corner_eval")
    def syncCornerEvalAssets = tasks.register('syncCornerEvalAssets', Sync) {
        from(cornerEvalSource) {
            include 'images/**', 'labels/**'
        }
        if (cornerEvalModel != null) {
            def modelFile = rootProject.file(cornerEvalModel)
            if (!modelFile.isFile()) {
                throw new GradleException("cornerEvalModel is not a file: ${modelFile}")
            }
            from(modelFile) {
                into 'model'
            }
        }
        into cornerEvalAssets.map { it.dir('corner_eval') }
    }
    android.sourceSets.androidTest.assets.srcDirs += [cornerEvalAssets.get().asFile]
    tasks.configureEach { t ->
        if (t.name.startsWith('merge') && t.name.endsWith('AndroidTestAssets')) {
            t.dependsOn(syncCornerEvalAssets)
        }
    }
}
