Categories:
  - Graphics
  - Multimedia
License: Apache-2.0
AuthorName: egdels
WebSite: https://egdels.github.io/makeacopy
SourceCode: https://github.com/egdels/makeacopy
IssueTracker: https://github.com/egdels/makeacopy/issues
Changelog: https://github.com/egdels/makeacopy/releases

AutoName: MakeACopy

RepoType: git
Repo: https://github.com/egdels/makeacopy.git
Binaries:
  https://github.com/egdels/makeacopy/releases/download/v%v/MakeACopy-v%v-release.apk

Builds:
  - versionName: 1.0.6
    versionCode: 10006
    commit: c02f074c987934c4275f5d69efa42de1bc1b10c1
    timeout: 14400
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake make ninja-build
    gradle:
      - yes
    scandelete:
      - external/opencv
    build:
      - cd ../scripts
      - chmod +x *.sh
      - ./build_opencv_android.sh
      - ./prepare_opencv.sh
    ndk: r27d

  - versionName: 1.3.0
    versionCode: 103001
    commit: 251db775bfc6cbb26680bbe9b2a1e4794be6955b
    timeout: 14400
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y make ninja-build
      - apt-get install -y cmake -t bookworm-backports
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary:
      https://github.com/egdels/makeacopy/releases/download/v%v/MakeACopy-v%v-armeabi-v7a-release.apk
    rm:
      - external/onnxruntime/onnxruntime/test
      - external/onnxruntime/samples
    prebuild: sed -i -e '/^\t\tif (publishToAdo) {/,/^\t\t}/d' ../external/onnxruntime/java/build.gradle
    scanignore:
      - external/onnxruntime/java/build-android.gradle
      - external/onnxruntime/java/build.gradle
      - external/onnxruntime/js/react_native/e2e/android/build.gradle
      - external/onnxruntime/js/react_native/android/build.gradle
    scandelete:
      - external/opencv
      - external/onnxruntime
    build:
      - cd ../scripts
      - chmod +x *.sh
      - export ABIS="armeabi-v7a"
      - ./build_opencv_android.sh
      - ./prepare_opencv.sh
      - ./build_onnxruntime_android.sh
    ndk: 28.0.13004108
    gradleprops:
      - enableAbiSplits=true
      - ABIS=armeabi-v7a

